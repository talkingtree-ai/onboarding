name: onboarding-containers

services:
  status:
    build:
      context: ../../../../examples/status-service
    image: onboarding-status:local
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      APP_VERSION: "1.0.0"
      APP_ENV: sandbox
    volumes:
      - status-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 64
    restart: "no"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  status-data:
